<!doctype html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Retail Tycoon: Origins - Shop Owner Setup</title>
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

	<style>
		:root {
			--bg-deep: #141519;
			--card-bg: #202228;
			--text-main: #ffffff;
			--text-muted: #8e929c;
			--accent-yellow: #ffd233;
			--accent-blue: #33a1ff;
			--accent-purple: #8b5cf6;
		}

		body {
			background: #0a0b0d;
			font-family: "Poppins", sans-serif;
			margin: 0;
			padding: 40px;
			display: flex;
			flex-direction: column;
			gap: 50px;
		}

		.category-section {
			display: flex;
			flex-direction: column;
		}

		.category-title {
			color: var(--text-main);
			font-size: 22px;
			font-weight: 700;
			margin-bottom: 25px;
			padding-left: 15px;
			border-left: 5px solid var(--accent-yellow);
			letter-spacing: 1px;
			text-transform: uppercase;
		}

		.screens-row {
			display: flex;
			gap: 40px;
			overflow-x: auto;
			padding-bottom: 20px;
			align-items: flex-start;
			scrollbar-width: thin;
			scrollbar-color: #2a2d35 #0a0b0d;
		}

		.screens-row::-webkit-scrollbar {
			height: 8px;
		}

		.screens-row::-webkit-scrollbar-thumb {
			background-color: #2a2d35;
			border-radius: 10px;
		}

		.iphone-frame {
			width: 330px;
			height: 710px;
			background: var(--bg-deep);
			border-radius: 45px;
			border: 10px solid #1c1d22;
			position: relative;
			flex-shrink: 0;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			box-shadow:
				0 30px 60px rgba(0, 0, 0, 0.7),
				inset 0 2px 10px rgba(255, 255, 255, 0.05);
		}

		.notch {
			width: 100px;
			height: 28px;
			background: #000;
			position: absolute;
			top: 10px;
			left: 50%;
			transform: translateX(-50%);
			border-radius: 20px;
			z-index: 100;
		}

		.screen-content {
			padding: 60px 24px 30px;
			height: 100%;
			display: flex;
			flex-direction: column;
			box-sizing: border-box;
			position: relative;
			overflow-y: auto;
		}

		.screen-label {
			text-align: center;
			color: #8e929c;
			margin-top: 20px;
			font-size: 14px;
			font-weight: 500;
		}

		.heading-xl {
			font-size: 28px;
			font-weight: 700;
			color: var(--text-main);
			margin: 0 0 8px 0;
			line-height: 1.3;
		}

		.sub-text {
			font-size: 13px;
			color: var(--text-muted);
			margin: 0;
			line-height: 1.5;
			font-weight: 400;
		}

		.icon-3d {
			font-size: 90px;
			display: inline-block;
			margin-bottom: 20px;
			animation: float 4s ease-in-out infinite;
		}

		.icon-yellow-glow {
			filter: drop-shadow(0px 15px 15px rgba(0, 0, 0, 0.6)) drop-shadow(0px 10px 30px rgba(255, 210, 51, 0.3));
		}

		@keyframes float {

			0%,
			100% {
				transform: translateY(0px);
			}

			50% {
				transform: translateY(-10px);
			}
		}

		.input-group {
			margin-bottom: 15px;
		}

		.input-label {
			color: var(--text-muted);
			font-size: 12px;
			font-weight: 500;
			margin-left: 5px;
			display: block;
		}

		.input-soft {
			width: 100%;
			background: #1a1c21;
			border: 2px solid #2a2d35;
			padding: 18px;
			border-radius: 20px;
			color: white;
			font-size: 15px;
			box-sizing: border-box;
			outline: none;
			transition: 0.3s;
			font-family: "Poppins", sans-serif;
			margin-top: 10px;
		}

		.btn-pill {
			border: none;
			padding: 18px;
			border-radius: 30px;
			color: #000;
			font-weight: 600;
			font-size: 16px;
			width: 100%;
			cursor: pointer;
			margin-top: auto;
			display: flex;
			justify-content: center;
			align-items: center;
			gap: 10px;
			font-family: "Poppins", sans-serif;
		}

		.btn-yellow {
			background: var(--accent-yellow);
			box-shadow: 0 10px 25px rgba(255, 210, 51, 0.3);
		}

		.startup-icon-wrap {
			width: 120px;
			height: 120px;
			border-radius: 50%;
			display: flex;
			justify-content: center;
			align-items: center;
			font-size: 55px;
			margin: 30px auto 30px auto;
			animation: bounceIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
		}

		@keyframes bounceIn {
			0% {
				transform: scale(0);
				opacity: 0;
			}

			50% {
				transform: scale(1.1);
			}

			100% {
				transform: scale(1);
				opacity: 1;
			}
		}

		.fund-box {
			background: #1a1c21;
			border-radius: 20px;
			padding: 20px;
			border: 2px dashed rgba(255, 255, 255, 0.1);
			margin-top: 20px;
			animation: slideUp 0.5s ease-out 0.5s forwards;
			opacity: 0;
			transform: translateY(20px);
		}

		@keyframes slideUp {
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}

		/* --- NAVIGATION --- */
		.header-nav {
			margin-bottom: 20px;
			padding-left: 10px;
		}

		.btn-back {
			text-decoration: none;
			color: var(--text-muted);
			font-weight: 600;
			font-size: 14px;
			display: inline-flex;
			align-items: center;
			gap: 8px;
			transition: 0.3s;
		}

		.btn-back:hover {
			color: var(--accent-blue);
		}
	</style>
</head>

<body>
	<div class="header-nav">
		<a href="setup.htm" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Menu</a>
	</div>
	<div class="category-section">
		<h2 class="category-title">
			Shop Setup
		</h2>
		<div class="screens-row">

			<div>
				<div class="iphone-frame">
					<div class="notch"></div>
					<div class="screen-content">
						<div style="text-align: center; margin: 30px 0 20px 0;">
							<div class="icon-3d icon-yellow-glow">🛒</div>
						</div>
						<h1 class="heading-xl" style="text-align: center">Setup Shop</h1>
						<p class="sub-text" style="text-align: center; margin-bottom: 30px">Give your market a name to
							start tracking sales and customers.</p>
						<div class="input-group"><label class="input-label">BUSINESS NAME</label><input type="text"
								class="input-soft" placeholder="e.g. Nexus Retail" /></div>
						<button class="btn-pill btn-yellow">Start Business <i class="fas fa-check"></i></button>
					</div>
				</div>
				<div class="screen-label">Owner Setup</div>
			</div>

			<div>
				<div class="iphone-frame">
					<div class="notch"></div>
					<div class="screen-content"
						style="justify-content: center; align-items: center; text-align: center;">
						<div class="startup-icon-wrap"
							style="background: rgba(255, 210, 51, 0.1); color: var(--accent-yellow); border: 2px solid var(--accent-yellow); box-shadow: 0 0 30px rgba(255, 210, 51, 0.4);">
							<i class="fas fa-store"></i>
						</div>
						<h1 class="heading-xl" style="font-size: 24px; margin-bottom: 10px;">Shop Opened!</h1>
						<p class="sub-text" style="color: var(--text-muted); font-size: 13px; max-width: 90%;">Welcome
							to your new supermarket. You have received an initial bank loan to setup your store.</p>

						<div class="fund-box" style="border-color: rgba(255, 210, 51, 0.3);">
							<p style="margin: 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase;">
								Initial Shop Fund</p>
							<h2
								style="margin: 5px 0 0 0; color: var(--accent-yellow); font-size: 32px; font-weight: 700;">
								₹ 50,000</h2>
						</div>

						<button class="btn-pill btn-yellow"
							style="margin-top: auto; box-shadow: 0 10px 25px rgba(255, 210, 51, 0.4);">Enter Dashboard
							<i class="fas fa-arrow-right"></i></button>
					</div>
				</div>
				<div class="screen-label">Owner Startup</div>
			</div>

		</div>
	</div>
</body>

</html>
