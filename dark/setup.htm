<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Retail Tycoon: Origins - Setup Selection</title>
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
			rel="stylesheet" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />

		<style>
			:root {
				--bg-deep: #0a0b0d;
				--card-bg: #141519;
				--text-main: #ffffff;
				--text-muted: #8e929c;
				--accent-yellow: #ffd233;
				--accent-blue: #33a1ff;
				--accent-purple: #8b5cf6;
			}

			body {
				background: var(--bg-deep);
				font-family: "Poppins", sans-serif;
				margin: 0;
				padding: 0;
				display: flex;
				justify-content: center;
				align-items: center;
				min-height: 100vh;
				color: var(--text-main);
			}

			.dashboard-container {
				max-width: 800px;
				width: 90%;
				text-align: center;
				padding: 40px;
			}

			h1 {
				font-size: 36px;
				margin-bottom: 10px;
				color: white;
				font-weight: 700;
			}

			p.subtitle {
				color: var(--text-muted);
				font-size: 16px;
				margin-bottom: 50px;
			}

			.categories-grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
				gap: 30px;
			}

			.category-card {
				background: var(--card-bg);
				border-radius: 30px;
				padding: 40px;
				text-decoration: none;
				color: inherit;
				transition: all 0.4s ease;
				border: 1px solid rgba(255, 255, 255, 0.05);
				display: flex;
				flex-direction: column;
				align-items: center;
			}

			.category-card:hover {
				transform: translateY(-10px);
				border-color: white;
				box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
			}

			.icon-wrap {
				width: 70px;
				height: 70px;
				border-radius: 20px;
				background: #1a1c21;
				display: flex;
				justify-content: center;
				align-items: center;
				font-size: 32px;
				margin-bottom: 20px;
			}

			.cat-warehouse .icon-wrap { color: var(--accent-blue); border: 1px solid rgba(51, 161, 255, 0.2); }
			.cat-shop .icon-wrap { color: var(--accent-yellow); border: 1px solid rgba(255, 210, 51, 0.2); }

			.category-card h2 {
				font-size: 20px;
				margin: 0 0 10px 0;
				font-weight: 600;
			}

			.category-card p {
				color: var(--text-muted);
				font-size: 13px;
				line-height: 1.5;
				margin: 0;
			}

			.btn-explore {
				margin-top: 20px;
				padding: 8px 20px;
				border-radius: 15px;
				background: rgba(255, 255, 255, 0.05);
				font-size: 12px;
				font-weight: 600;
				transition: 0.3s;
			}

			.category-card:hover .btn-explore {
				background: white;
				color: black;
			}

			.header-nav {
				position: absolute;
				top: 40px;
				left: 40px;
			}

			.btn-back {
				text-decoration: none;
				color: var(--text-muted);
				font-weight: 600;
				font-size: 14px;
				display: flex;
				align-items: center;
				gap: 8px;
				transition: 0.3s;
			}

			.btn-back:hover {
				color: var(--accent-blue);
			}
		</style>
	</head>
	<body>
		<div class="header-nav">
			<a href="screens.htm" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Main Menu</a>
		</div>
		<div class="dashboard-container">
			<h1>Business Setup</h1>
			<p class="subtitle">Choose which business type you want to configure first.</p>
			
			<div class="categories-grid">
				<a href="supplier-setup.htm" class="category-card cat-warehouse">
					<div class="icon-wrap">🏢</div>
					<h2>Warehouse Setup</h2>
					<p>Configuration for suppliers, logistics, and bulk inventory management.</p>
					<div class="btn-explore">Configure <i class="fas fa-chevron-right"></i></div>
				</a>

				<a href="owner-setup.htm" class="category-card cat-shop">
					<div class="icon-wrap">🏪</div>
					<h2>Shop Setup</h2>
					<p>Configuration for retail owners, market naming, and terminal initialization.</p>
					<div class="btn-explore">Configure <i class="fas fa-chevron-right"></i></div>
				</a>
			</div>
		</div>
	</body>
</html>
